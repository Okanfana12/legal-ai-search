name: CD - Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/legal-ai-search:staging
            ${{ secrets.DOCKER_USERNAME }}/legal-ai-search:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_KEY }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/legal-ai-search:staging
            docker stop legal-ai-search-staging || true
            docker rm legal-ai-search-staging || true
            docker run -d \
              --name legal-ai-search-staging \
              -p 8501:8501 \
              --restart unless-stopped \
              --env-file /home/${{ secrets.VPS_STAGING_USER }}/legal-ai-search/.env \
              -v /home/${{ secrets.VPS_STAGING_USER }}/legal-ai-search/chroma_db:/app/chroma_db \
              ${{ secrets.DOCKER_USERNAME }}/legal-ai-search:staging

      - name: Healthcheck staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_KEY }}
          script: |
            set -e
            for i in $(seq 1 30); do
              if curl --silent --fail http://127.0.0.1:8501/_stcore/health >/dev/null; then
                echo "Staging healthcheck passed"
                exit 0
              fi
              sleep 2
            done
            echo "Staging healthcheck failed"
            docker logs legal-ai-search-staging
            exit 1
